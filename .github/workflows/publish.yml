name: Publish Arch repository

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to publish (for example, v0.37.0-beta)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arch-repository
  cancel-in-progress: false

jobs:
  # Pages can skip a deployment whose build version it deployed before, and it
  # only accepts a commit SHA as that version. A release or nightly dispatch runs
  # on the same main commit as the previous deploy, so every run deploys a new
  # commit with main's tree, kept on the pages-builds branch.
  build-version:
    name: Create Pages build commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Create Pages build commit
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data: head } = await github.rest.git.getCommit({ ...context.repo, commit_sha: context.sha })
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: `Pages build for run ${context.runId}`,
              tree: head.tree.sha,
              parents: [context.sha],
            })
            try {
              await github.rest.git.updateRef({ ...context.repo, ref: 'heads/pages-builds', sha: commit.sha, force: true })
            } catch (error) {
              if (error.status !== 422) throw error
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/heads/pages-builds', sha: commit.sha })
            }
            core.setOutput('sha', commit.sha)

  build:
    name: Build signed repository
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install tools
        run: pacman --sync --refresh --sysupgrade --noconfirm git github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve releases
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          set -euo pipefail
          requested_tag="$INPUT_TAG"
          stable_pattern='^v([0-9]+\.[0-9]+\.[0-9]+)-beta$'
          nightly_pattern='^v(([0-9]+\.[0-9]+\.[0-9]+)-nightly-[0-9]+)$'

          # Always publish the newest releases, so a replayed or manual event
          # cannot replace a newer package in either repository.
          newest() {
            printf '%s\n' "$@" | grep -v '^$' | sort -V | tail -n 1
          }

          stable_tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          nightly_tag="$(gh release list --repo OpenTubeX/OpenTubeX --limit 100 \
            --json createdAt,isPrerelease,tagName \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$")))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')"

          # The requested release can be newer than the release list returns.
          if [[ "$requested_tag" =~ $stable_pattern ]]; then
            stable_tag="$(newest "$stable_tag" "$requested_tag")"
          elif [[ "$requested_tag" =~ $nightly_pattern ]]; then
            nightly_tag="$(newest "$nightly_tag" "$requested_tag")"
          elif [[ -n "$requested_tag" ]]; then
            echo "Expected a stable or nightly OpenTubeX tag, got: $requested_tag" >&2
            exit 1
          fi

          if [[ ! "$stable_tag" =~ $stable_pattern ]]; then
            echo "Expected a stable tag, got: $stable_tag" >&2
            exit 1
          fi
          stable_version="${BASH_REMATCH[1]}"

          nightly_version=''
          promote_stable=true
          if [[ -n "$nightly_tag" ]]; then
            if [[ ! "$nightly_tag" =~ $nightly_pattern ]]; then
              echo "Expected a nightly tag, got: $nightly_tag" >&2
              exit 1
            fi
            nightly_version="${BASH_REMATCH[1]}"
            # Nightlies are numbered after the release they follow, so only a
            # newer stable release replaces the nightly package.
            if [[ "$(newest "${BASH_REMATCH[2]}" "$stable_version")" == "${BASH_REMATCH[2]}" ]]; then
              promote_stable=false
            fi
          fi

          {
            echo "stable_tag=$stable_tag"
            echo "stable_version=$stable_version"
            echo "nightly_tag=$nightly_tag"
            echo "nightly_version=$nightly_version"
            echo "promote_stable=$promote_stable"
          } >> "$GITHUB_OUTPUT"

      - name: Download Debian packages
        env:
          RELEASE_TAG: ${{ steps.release.outputs.stable_tag }}
          VERSION: ${{ steps.release.outputs.stable_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          gh release download "$RELEASE_TAG" \
            --repo OpenTubeX/OpenTubeX \
            --dir release-files \
            --pattern "opentubex_${VERSION}_beta_amd64.deb" \
            --pattern "opentubex_${VERSION}_beta_arm64.deb"

      - name: Download nightly Debian packages
        if: steps.release.outputs.promote_stable != 'true' && steps.release.outputs.nightly_tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.nightly_tag }}
          VERSION: ${{ steps.release.outputs.nightly_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir nightly-files
          gh release download "$RELEASE_TAG" \
            --repo OpenTubeX/OpenTubeX \
            --dir nightly-files \
            --pattern "opentubex_${VERSION}_amd64.deb" \
            --pattern "opentubex_${VERSION}_arm64.deb"

      - name: Promote stable Debian packages to nightly
        if: steps.release.outputs.promote_stable == 'true'
        run: cp --recursive release-files nightly-files

      # makepkg refuses to run as root.
      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        id: signing-key
        env:
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ARCH_GPG_PRIVATE_KEY" ]]; then
            echo 'The ARCH_GPG_PRIVATE_KEY secret is not configured.' >&2
            exit 1
          fi

          printf '%s\n' "$ARCH_GPG_PRIVATE_KEY" | runuser -u builder -- gpg --batch --import
          fingerprint="$(runuser -u builder -- gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"

          if [[ -z "$fingerprint" ]]; then
            echo 'No private signing key was imported.' >&2
            exit 1
          fi

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build signed repository
        env:
          ARCH_GPG_KEY_ID: ${{ steps.signing-key.outputs.fingerprint }}
          ARCH_GPG_PASSPHRASE: ${{ secrets.ARCH_GPG_PASSPHRASE }}
          ARCH_PUBLISHED_URL: https://arch.opentubex.org
        run: runuser -u builder -- ./scripts/build-repository.sh release-files repository nightly-files

      - name: Upload repository
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository

  deploy:
    name: Publish repository
    needs: [build, build-version]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    permissions:
      id-token: write
      pages: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # actions/deploy-pages always uses the run's commit SHA as the build version.
      - name: Deploy repository
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_VERSION: ${{ needs.build-version.outputs.sha }}
        with:
          retries: 3
          script: |
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: process.env.BUILD_VERSION,
              oidc_token: await core.getIDToken(),
            })
            const id = deployment.id ?? deployment.status_url.split('/').pop()
            core.setOutput('page_url', deployment.page_url)
            const deadline = Date.now() + 20 * 60 * 1000
            let status
            do {
              if (Date.now() > deadline) throw new Error(`Pages deployment ${id} timed out in ${status}`)
              await new Promise(resolve => setTimeout(resolve, 10000))
              ;({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { ...context.repo, id }))
              core.info(`Pages deployment ${id}: ${status}`)
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error(`Pages deployment ${id} ended with ${status}`)
              }
            } while (status !== 'succeed')
